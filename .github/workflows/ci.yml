name: ci
on: [pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Tải dữ liệu drones (dùng cho smoke test)
        run: >
          hf download DataScience-UIBK/RETECO-SemEval2027 --repo-type dataset
          --include "track2_recor/drones/*" --local-dir data/reteco
      - run: pytest -q
        env:
          DATA_DIR: data/reteco
